# OPTIONAL: build, sign and publish a release on GitHub instead of on your Mac.
# Run it from the Actions tab ("Release" → "Run workflow"). It needs these repository secrets
# (Settings → Secrets and variables → Actions); without them it stops before doing anything:
#   RDM_KEYSTORE_BASE64   base64 of keystore/rdm-eq-release.jks
#   RDM_STORE_PASSWORD    storePassword from keystore.properties
#   RDM_KEY_ALIAS         keyAlias
#   RDM_KEY_PASSWORD      keyPassword
# The normal (recommended) way to release is scripts/release.sh on your Mac, which keeps the key offline.
name: Release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 1.2.0"
        required: true
      prerelease:
        description: "Publish as beta (pre-release)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.RDM_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check signing secrets
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::Signing secrets are not configured. Use scripts/release.sh on your Mac, or add the secrets listed in this file."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (never written to the repository)
        run: |
          mkdir -p keystore
          echo "${{ secrets.RDM_KEYSTORE_BASE64 }}" | base64 -d > keystore/rdm-eq-release.jks
          {
            echo "storeFile=keystore/rdm-eq-release.jks"
            echo "storePassword=${{ secrets.RDM_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.RDM_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.RDM_KEY_PASSWORD }}"
          } > keystore.properties
      - name: Bump version
        run: |
          code=$(( $(grep '^VERSION_CODE=' version.properties | cut -d= -f2) + 1 ))
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$code/; s/^VERSION_NAME=.*/VERSION_NAME=${{ inputs.version_name }}/" version.properties
          echo "CODE=$code" >> "$GITHUB_ENV"
      - name: Test and build signed release
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:assembleRelease
      - name: Verify, checksum and metadata
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          $BT/apksigner verify $APK
          CERT=$($BT/apksigner verify --print-certs $APK | awk '/Signer #1 certificate SHA-256 digest/ {print $NF}')
          test "$CERT" = "$(tr -d '[:space:]' < release-signing-cert.sha256)" || { echo "::error::Wrong signing key"; exit 1; }
          V=${{ inputs.version_name }}; NAME=RDM-Eq-$V.apk
          mkdir -p dist && cp $APK dist/$NAME
          SHA=$(sha256sum dist/$NAME | cut -d' ' -f1); SIZE=$(stat -c%s dist/$NAME)
          (cd dist && sha256sum $NAME > SHA256SUMS.txt)
          printf '{\n  "applicationId": "com.rdm.eq",\n  "versionCode": %s,\n  "versionName": "%s",\n  "apk": "%s",\n  "sha256": "%s",\n  "size": %s,\n  "signingCertSha256": "%s",\n  "minSdk": 28\n}\n' \
            "$CODE" "$V" "$NAME" "$SHA" "$SIZE" "$CERT" > dist/rdm-eq-update.json
          cat dist/rdm-eq-update.json
      - name: Commit version, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ inputs.version_name }}
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties && git commit -m "Release v$V" && git tag -a "v$V" -m "RDM Eq $V" && git push origin HEAD "v$V"
          FLAG=--latest; [ "${{ inputs.prerelease }}" = "true" ] && FLAG=--prerelease
          gh release create "v$V" dist/RDM-Eq-$V.apk dist/rdm-eq-update.json dist/SHA256SUMS.txt --title "RDM Eq $V" --generate-notes $FLAG
      - name: Remove key from runner
        if: always()
        run: rm -f keystore/rdm-eq-release.jks keystore.properties
